<br/>

<mat-form-field style="margin-left: 1%;">
    <mat-label>Search</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Search here..." #input>
</mat-form-field>
<br/>

<div style="margin-left: 1%;margin-right: 1%;">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>

    <!--- Note that these columns can be defined in any order.
          The actual rendered columns are set as a property on the row definition" -->
  
    <!-- Position Column -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef mat-sort-header style="background-color: rgb(247, 209, 247);"> Title </th>
      <td mat-cell *matCellDef="let element" class="title" (click)="description(element.title)"> {{element.title}} </td>
    </ng-container>
  
    <!-- Name Column -->
    <ng-container matColumnDef="author">
      <th mat-header-cell *matHeaderCellDef mat-sort-header style="background-color: rgb(247, 209, 247);"> Author </th>
      <td mat-cell *matCellDef="let element"> {{element.author}} </td>
    </ng-container>
  
    <!-- Weight Column -->
    <ng-container matColumnDef="genre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header style="background-color: rgb(247, 209, 247);"> Genre </th>
      <td mat-cell *matCellDef="let element"> {{element.genre}} </td>
    </ng-container>
  
    <!-- Symbol Column -->
    <ng-container matColumnDef="year">
      <th mat-header-cell *matHeaderCellDef mat-sort-header style="background-color: rgb(247, 209, 247);"> Published Year </th>
      <td mat-cell *matCellDef="let element"> {{element.year}} </td>
    </ng-container>

    <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef mat-sort-header style="background-color: rgb(247, 209, 247);"> Action </th>
        <td mat-cell *matCellDef="let element">
            <mat-icon matTooltip="Add To ReadingList" (click)="add(element)"
            style="cursor: pointer;color: blue;"> add_circle </mat-icon>
            <!-- <mat-icon matTooltip="Remove" style="cursor: pointer;color: red;"> delete </mat-icon> -->
         </td>
      </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>

<br/>
<br/>

                               <!-- Reading List -->

<div style="width: 50%;margin-left: 1%;" *ngIf="ReadingList.length>0">
  <table mat-table [dataSource]="dataSource2" class="readingList" matSort>

    <ng-container matColumnDef="books">
      <th mat-header-cell *matHeaderCellDef mat-sort-header style="background-color: rgb(247, 209, 247);"> Book Selected </th>
      <td mat-cell *matCellDef="let element"> {{element.title}} </td>
    </ng-container>

    <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef mat-sort-header style="background-color: rgb(247, 209, 247);"> Action </th>
        <td mat-cell *matCellDef="let element">
            <!-- <mat-icon matTooltip="Add To ReadingList" (click)="add(element)"
            style="cursor: pointer;color: blue;"> add_circle </mat-icon> -->
            <mat-icon matTooltip="Remove" (click)="delete(element)"
            style="cursor: pointer;color: red;"> delete </mat-icon>
         </td>
      </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="displayedColumns2"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns2;"></tr>
  </table>
</div>
